  background:linear-gradient(var(--seal-soft),var(--seal-soft)) center/1px 100% no-repeat,linear-gradient(var(--seal-soft),var(--seal-soft)) center/100% 1px no-repeat}

<script>

<script>
(function(){
const TABS=[["today","今","Hôm nay"],["focus","要","Trọng tâm"],["cards","记","Thẻ nhớ"],["learn","学","Bài học"],["find","查","Tra từ"]];
const DAY=86400000, BOX=[0,1,2,4,7,15];
const S={tab:"today",unit:null,sub:"vocab",units:[],loaded:false,db:null,user:null,uid:null,canEdit:false,
  prog:{cards:{},scores:{}},cards:null,quiz:null,find:"",editId:null,hideVi:true,hideCol:null,reveal:{},dir:"zh"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let toastT=0;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200)}
const key=(u,v)=>u.id+":"+v.zh;
function mergeUnits(a){const ex=(window.TV_EXTRA&&window.TV_EXTRA.units)||[],ids=new Set(a.map(x=>x.id));return a.concat(ex.filter(x=>!ids.has(x.id)).map(x=>JSON.parse(JSON.stringify(x))))}
function unitsSorted(){return S.units.slice().sort((a,b)=>(a.order||99)-(b.order||99))}
function allVocab(){const r=[];unitsSorted().forEach(u=>(u.vocab||[]).forEach(v=>r.push({u,v,k:key(u,v)})));return r}
function cardState(k){return S.prog.cards[k]||null}
function isDue(k){const c=cardState(k);return !c||c.d<=Date.now()}
function known(u){const vs=u.vocab||[];if(!vs.length)return 0;let n=0;vs.forEach(v=>{const c=cardState(key(u,v));if(c&&c.b>=2)n++});return n/vs.length}

/* ---------- lưu tiến độ: localStorage (dự phòng) + DB của app ---------- */
const LS="tvyhct-progress";
function loadLocal(){try{const t=localStorage.getItem(LS);if(t)S.prog=Object.assign({cards:{},scores:{}},JSON.parse(t))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S.prog))}catch(e){}}
let saving=false,dirty=false,saveT=0;
function saveProg(){saveLocal();if(!S.db||!S.uid)return;dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,1500)}
async function flush(){if(saving||!dirty)return;saving=true;dirty=false;
  try{await S.db.doc("data/users/"+S.uid+"/progress").set({cards:S.prog.cards,scores:S.prog.scores,qs:S.prog.qs||{},stats:S.prog.stats||null,updated:Date.now()})}catch(e){}
  saving=false;if(dirty)flush()}

/* ---------- tab & header ---------- */
function drawTabs(){$("#tabs").innerHTML=TABS.map(([id,g,l])=>`<button data-tab="${id}" ${S.tab===id?'aria-current="page"':''}><span class="g" aria-hidden="true">${g}</span>${l}</button>`).join("")}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.tab=b.dataset.tab;if(S.tab!=="learn")S.unit=null;render();scrollTo(0,0)});
$("#backBtn").addEventListener("click",()=>{S.unit=null;render();scrollTo(0,0)});
$("#editBtn").addEventListener("click",()=>{S.tab=S.tab==="edit"?"today":"edit";S.unit=null;render();scrollTo(0,0)});
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;$("#installBtn").hidden=false});
$("#installBtn").addEventListener("click",async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;$("#installBtn").hidden=true});

function render(){drawTabs();const u=S.unit&&S.units.find(x=>x.id===S.unit);
  $("#backBtn").hidden=!(S.tab==="learn"&&u);
  $("#editBtn").hidden=!S.canEdit;
  $("#editBtn").setAttribute("aria-pressed",String(S.tab==="edit"));
  $("#hTitle").textContent=u?u.title:"Trung Y Văn HIU";
  $("#hSub").innerHTML=u?`<span class="hz">${esc(u.zh)}</span>${u.teacher?" · "+esc(u.teacher):""}`:"Học phần Trung văn chuyên ngành";
  const v=$("#view");
  if(!S.loaded){v.innerHTML=`<div class="empty"><span class="hz" aria-hidden="true">学</span>Đang mở bài học…</div>`;return}
  ({today:v3=>window.TVT?window.TVT.view(v3):0,learn:v=>u?vUnit(v,u):vHome(v),focus:v2=>window.TVF?window.TVF.view(v2):0,cards:vCards,quiz:vQuiz,find:vFind,edit:vEdit})[S.tab](v,u)}

function emptyUnits(v){v.innerHTML=`<div class="panel empty"><span class="hz" aria-hidden="true">空</span>Chưa có bài học nào. ${S.canEdit?'Bấm <b>Soạn</b> ở góc phải trên để thêm bài đầu tiên.':'Người soạn chưa thêm nội dung.'}</div>`}

/* ---------- bài học ---------- */
function vHome(v){
  if(!S.units.length)return emptyUnits(v);
  v.innerHTML=`
  <section class="panel row" style="justify-content:space-between">
    <div style="min-width:0;flex:1"><h3>Ôn nhanh hôm nay</h3><p class="note" style="margin:2px 0 0">20 thẻ đến hạn, rồi 10 câu trắc nghiệm trộn mọi bài.</p></div>
    <button class="btn pri" id="quick">Bắt đầu</button>
  </section>
  <section style="display:flex;flex-direction:column;gap:8px">
    <span class="label">Các bài</span>

/* ---------- thẻ nhớ ---------- */
function startCards(ids,dueOnly){
  let pool=allVocab().filter(x=>!ids||ids.includes(x.u.id));
  let due=pool.filter(x=>isDue(x.k));
  due.sort((a,b)=>(cardState(a.k)?0:1)-(cardState(b.k)?0:1));
  let list=(dueOnly||due.length)?due:pool;
  if(!ids||dueOnly)list=list.slice(0,20);
  S.cards={ids,list:ids?shuffle(list):list,i:0,flip:false,ok:0,miss:0,thenQuiz:!!dueOnly&&!ids};
}
function vCards(v){
  if(!S.units.length)return emptyUnits(v);
  if(!S.cards){v.innerHTML=cardPicker();bindPicker(v);return}
  const C=S.cards;
  if(!C.list.length){v.innerHTML=`<div class="panel empty"><span class="hz" aria-hidden="true">好</span>Không còn thẻ đến hạn ở phần này. Chọn bài khác hoặc ôn lại toàn bộ.</div><button class="btn" id="cBack">Chọn bài khác</button>`;$("#cBack").onclick=()=>{S.cards=null;render()};return}
  if(C.i>=C.list.length){
    v.innerHTML=`<div class="panel" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start"><span class="label">Xong lượt ôn</span><div class="score">${C.ok}/${C.list.length}</div><p class="lead">Nhớ ${C.ok} thẻ, cần ôn lại ${C.miss} thẻ. Thẻ chưa nhớ sẽ quay lại sớm hơn ở lần ôn sau.</p>
      <div class="row">${C.thenQuiz?`<button class="btn pri" id="toQuiz">Làm 10 câu trắc nghiệm</button>`:""}<button class="btn ${C.thenQuiz?"":"pri"}" id="again">Ôn tiếp</button><button class="btn" id="cBack">Chọn bài khác</button></div></div>`;
    $("#again").onclick=()=>{startCards(C.ids,C.thenQuiz);render()};
    $("#cBack").onclick=()=>{S.cards=null;render()};
    if(C.thenQuiz)$("#toQuiz").onclick=()=>{S.tab="quiz";startQuiz(null,10);render()};
    return}
  const x=C.list[C.i],w=x.v,len=[...w.zh].length,sz=len>4?"s":len>2?"m":"";
  const front=S.dir==="zh"
    ?`<div class="grid ${len>1?"wide":""}"><div class="big ${sz}">${esc(w.zh)}</div></div>`
    :`<div class="vi" style="font-size:20px;font-weight:600">${esc(w.vi)}</div><div class="hv">${esc(w.hv)}</div>`;
  const back=S.dir==="zh"
    ?`<div class="grid ${len>1?"wide":""}"><div class="big ${sz}">${esc(w.zh)}</div></div><div class="py">${esc(w.py)}</div><div class="hv">${esc(w.hv)}</div><div class="vi">${esc(w.vi)}</div>`
    :`<div class="grid ${len>1?"wide":""}"><div class="big ${sz}">${esc(w.zh)}</div></div><div class="py">${esc(w.py)}</div><div class="vi">${esc(w.vi)}</div>`;
  v.innerHTML=`
  <div class="row" style="justify-content:space-between"><span class="prog">Thẻ ${C.i+1}/${C.list.length} · nhớ ${C.ok}</span>
    <div class="row"><button class="chip" id="dir">${S.dir==="zh"?"Trung → Việt":"Việt → Trung"}</button><button class="chip" id="cStop">Dừng</button></div></div>
  <div class="card" id="card" role="button" tabindex="0" aria-label="Lật thẻ"><span class="from">${esc(x.u.title)}</span>${C.flip?back:front}<span class="hint">${C.flip?"":"Chạm để lật · phím cách"}</span></div>
  <div class="grade"><button class="btn no" id="no" style="min-height:48px" ${C.flip?"":"disabled"}>Chưa nhớ</button><button class="btn yes" id="yes" style="min-height:48px" ${C.flip?"":"disabled"}>Đã nhớ</button></div>
  <p class="note">Đã nhớ thì thẻ giãn dần 1 → 2 → 4 → 7 → 15 ngày; chưa nhớ thì về lại đầu.</p>`;

function grade(ok){const C=S.cards,x=C.list[C.i],c=cardState(x.k)||{b:0,d:0};
  const b=ok?Math.min(c.b+1,BOX.length-1):0;
  S.prog.cards[x.k]={b,d:Date.now()+(ok?BOX[b]*DAY:0)};
  ok?C.ok++:C.miss++;C.i++;C.flip=false;saveProg();render()}

  else if(C.flip&&(e.key==="1"||e.key==="ArrowLeft"))grade(false);
  else if(C.flip&&(e.key==="2"||e.key==="ArrowRight"))grade(true)});
let pick=null;

/* ---------- kiểm tra bài (từ bài học) ---------- */
function makeQs(ids,n){
  const us=unitsSorted().filter(u=>!ids||ids.includes(u.id));let qs=[];
  us.forEach(u=>(u.mcq||[]).forEach(m=>{if(Array.isArray(m.o)&&m.o.length>1)qs.push({u:u.title,q:m.q,o:m.o,a:m.a,e:m.e,t:m.t,s:m.s,f:m.f})}));
  const voc=[];us.forEach(u=>(u.vocab||[]).forEach(v=>voc.push({u,v})));
  const pool=allVocab().map(x=>x.v);
  shuffle(voc).slice(0,Math.max(n,20)).forEach(({u,v},i)=>{
    const dis=shuffle(pool.filter(p=>p.zh!==v.zh&&p.vi!==v.vi)).slice(0,3);if(dis.length<3)return;
    if(i%3===2){const o=shuffle([v,...dis]);qs.push({u:u.title,q:`“${v.vi}” viết là:`,o:o.map(x=>x.zh),a:o.indexOf(v),auto:1})}
    else if(i%3===1){const o=shuffle([v,...dis]);qs.push({u:u.title,q:`${v.zh} đọc là:`,o:o.map(x=>x.py),a:o.indexOf(v),auto:1})}
    else{const o=shuffle([v,...dis]);qs.push({u:u.title,q:`${v.zh} nghĩa là:`,o:o.map(x=>x.hv+" – "+x.vi),a:o.indexOf(v),auto:1})}});
  const teacher=qs.filter(q=>!q.auto),auto=qs.filter(q=>q.auto);
  const take=shuffle(teacher).slice(0,Math.ceil(n*0.6));
  return shuffle(take.concat(shuffle(auto).slice(0,n-take.length))).slice(0,n).map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}});
}
function startQuiz(ids,n){S.quiz={ids,n,qs:makeQs(ids,n),i:0,pick:null,right:0,wrong:[],t0:Date.now()}}

    <div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
    <div class="panel" style="display:flex;flex-direction:column;gap:14px"><span class="note">${esc(q.u)}</span><div class="qq">${esc(q.q)}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt ${p==null?"":i===q.a?"right":i===p?"wrong":""}" data-o="${i}" ${p==null?"":"disabled"}><span class="k">${"ABCD"[i]||i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${p==null?"":`<button class="btn pri" id="qNext" style="align-self:flex-end;min-height:44px">${Q.i+1<Q.qs.length?"Câu tiếp":"Xem kết quả"}</button>`}</div>`;

/* ---------- tra từ ---------- */
function vFind(v){
  v.innerHTML=`<label class="field"><span class="label">Tra từ</span><input type="search" id="fq" placeholder="Chữ Hán, pinyin, Hán Việt hoặc nghĩa (vd: tang, 脾, tỳ)" value="${esc(S.find)}" autocomplete="off"></label><div class="res" id="fr" style="margin-top:12px"></div>`;
  const inp=$("#fq");inp.oninput=()=>{S.find=inp.value;drawFind()};drawFind();
  if(!matchMedia("(pointer:coarse)").matches)inp.focus();
}
function drawFind(){const q=norm(S.find.trim()),box=$("#fr");
  if(!q){const n=allVocab().length;box.innerHTML=`<div class="empty"><span class="hz" aria-hidden="true">查</span>${n} từ trong ${S.units.length} bài. Gõ không dấu cũng được.</div>`;return}
  const hits=allVocab().filter(({v})=>[v.zh,v.py,v.hv,v.vi].some(f=>norm(f).includes(q)||norm(String(f).replace(/\s/g,"")).includes(q.replace(/\s/g,"")))).slice(0,60);
  box.innerHTML=hits.length?hits.map(({u,v})=>`<div class="hit"><span class="z">${esc(v.zh)}</span><div class="m"><span class="p">${esc(v.py)}</span> · <b>${esc(v.hv)}</b> · ${esc(v.vi)}</div><small>${esc(u.title)}</small></div>`).join(""):`<div class="empty">Không tìm thấy “${esc(S.find)}”.</div>`}

/* ---------- soạn (chỉ người soạn) ---------- */
const lines=t=>t.split(/\n/).map(s=>s.trim()).filter(Boolean).map(s=>s.split("|").map(x=>x.trim()));
function vEdit(v){
  if(!S.db){v.innerHTML=`<div class="panel empty"><span class="hz" aria-hidden="true">编</span>Trang đang mở ở chế độ chỉ đọc nên không lưu được nội dung. Mở lại app từ claude.ai khi đã đăng nhập.</div>`;return}
  if(!S.canEdit){v.innerHTML=`<div class="panel empty"><span class="hz" aria-hidden="true">编</span>Chỉ người soạn (chủ app hoặc người được cấp quyền Editor) mới sửa được nội dung. Bạn vẫn học và lưu tiến độ bình thường.</div>`;return}
  const us=unitsSorted(),u=S.editId&&S.units.find(x=>x.id===S.editId);
  v.innerHTML=`<div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <h2>Soạn nội dung</h2><p class="lead">Thêm từ, câu hỏi, bài khóa vào bài có sẵn hoặc tạo bài mới. Thay đổi hiện ngay cho mọi người mở app.</p>
    <div class="field"><label for="eu">Bài</label><select id="eu"><option value="">— Chọn bài —</option>${us.map(x=>`<option value="${esc(x.id)}" ${x.id===S.editId?"selected":""}>${esc(x.order)} · ${esc(x.title)}</option>`).join("")}<option value="__new" ${S.editId==="__new"?"selected":""}>+ Tạo bài mới</option></select></div></div>
  <div id="eb"></div>`;
  $("#eu").onchange=e=>{S.editId=e.target.value||null;render()};
  const eb=$("#eb");
  if(S.editId==="__new"){eb.innerHTML=`<div class="panel" style="display:flex;flex-direction:column;gap:10px">
    <div class="field"><label for="nt">Tên bài (tiếng Việt)</label><input type="text" id="nt" placeholder="Kinh lạc (slide thầy)"></div>
    <div class="field"><label for="nz">Tên chữ Hán</label><input type="text" id="nz" placeholder="经络"></div>
    <div class="field"><label for="ng">Giảng viên</label><input type="text" id="ng" placeholder="ThS. Hàn Quốc Việt"></div>
    <div class="field"><label for="no2">Thứ tự</label><input type="text" id="no2" inputmode="numeric" value="${us.length+1}"></div>
    <button class="btn pri" id="nSave" style="align-self:flex-start">Tạo bài</button></div>`;
    $("#nSave").onclick=async()=>{const t=$("#nt").value.trim();if(!t)return toast("Nhập tên bài trước");
      const id="u"+Date.now().toString(36);const body={order:+$("#no2").value||us.length+1,title:t,zh:$("#nz").value.trim(),teacher:$("#ng").value.trim(),source:"",vocab:[],passage:[],grammar:[],pairs:[],fills:[],qa:[],mcq:[]};
      if(await put(id,body)){S.editId=id;toast("Đã tạo bài");render()}};return}
  if(!u){eb.innerHTML="";return}
  eb.innerHTML=`
  <div class="panel" style="display:flex;flex-direction:column;gap:10px">
    <h3>Thêm nhanh</h3><p class="note" style="margin:0">Mỗi dòng một mục, các phần cách nhau bằng dấu <b>|</b>. Mục mới được thêm vào cuối, không xóa mục cũ.</p>
    <div class="field"><label for="aT">Loại</label><select id="aT">
      <option value="vocab">Từ vựng: 中文 | pinyin | Hán Việt | nghĩa</option>
      <option value="passage">Bài khóa: câu chữ Hán | bản dịch</option>
      <option value="fills">Điền khuyết: câu có ____ | đáp án</option>
      <option value="qa">Hỏi đáp: câu hỏi | câu trả lời</option>
      <option value="pairs">Trái nghĩa: từ | từ trái nghĩa</option>
      <option value="grammar">Ngữ pháp: cấu trúc | nghĩa | ví dụ</option>
      <option value="mcq">Trắc nghiệm: câu hỏi | A | B | C | D | đáp án đúng (A–D)</option></select></div>
    <textarea id="aX" placeholder="经络 | jīngluò | kinh lạc | kinh lạc"></textarea>
    <button class="btn pri" id="aGo" style="align-self:flex-start">Thêm vào bài</button></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:10px">
    <h3>Sửa toàn bộ bài (JSON)</h3><p class="note" style="margin:0">Dùng khi cần sửa hoặc xóa một mục. Giữ đúng dấu ngoặc và dấu phẩy.</p>
    <textarea class="code" id="jx" spellcheck="false">${esc(JSON.stringify(strip(u),null,1))}</textarea>
    <div class="row"><button class="btn pri" id="jGo">Lưu JSON</button><button class="btn warn" id="del">Xóa bài này</button></div><div id="cf"></div></div>`;
  $("#aGo").onclick=async()=>{const t=$("#aT").value,L=lines($("#aX").value);if(!L.length)return toast("Chưa có dòng nào");
    const mk={vocab:a=>({zh:a[0],py:a[1]||"",hv:a[2]||"",vi:a[3]||""}),passage:a=>({zh:a[0],vi:a[1]||""}),fills:a=>({q:a[0],a:a[1]||""}),qa:a=>({q:a[0],a:a[1]||""}),pairs:a=>[a[0],a[1]||""],grammar:a=>({pat:a[0],vi:a[1]||"",ex:a[2]||""}),
      mcq:a=>{const o=a.slice(1,-1).filter(Boolean),k=(a[a.length-1]||"").toUpperCase();return {q:a[0],o,a:Math.max(0,"ABCD".indexOf(k))}}};
    const bad=t==="mcq"&&L.some(a=>a.length<4);if(bad)return toast("Trắc nghiệm cần câu hỏi, ít nhất 2 lựa chọn và đáp án");
    const body=strip(u);body[t]=(body[t]||[]).concat(L.map(mk[t]));
    if(await put(u.id,body)){$("#aX").value="";toast(`Đã thêm ${L.length} mục`)}};
  $("#jGo").onclick=async()=>{let b;try{b=JSON.parse($("#jx").value)}catch(e){return toast("JSON lỗi: "+e.message.slice(0,60))}
    if(!b||typeof b!=="object"||!b.title)return toast("Bài cần có trường title");if(await put(u.id,b))toast("Đã lưu bài")};
  $("#del").onclick=()=>{$("#cf").innerHTML=`<div class="confirm"><span>Xóa hẳn bài “${esc(u.title)}”?</span><button class="btn warn" id="dy">Xóa</button><button class="btn" id="dn">Giữ lại</button></div>`;
    $("#dn").onclick=()=>$("#cf").innerHTML="";$("#dy").onclick=async()=>{try{await S.db.doc("units/"+u.id).delete();S.editId=null;toast("Đã xóa bài");render()}catch(e){toast("Không xóa được: "+(e.code||e.message))}}};
}
function strip(u){const b={...u};delete b.id;return JSON.parse(JSON.stringify(b))}
async function put(id,body){try{await S.db.doc("units/"+id).set(body);return true}catch(e){toast(e.code==="invalid_argument"?"Bạn không có quyền sửa nội dung":"Không lưu được: "+(e.code||e.message));return false}}

/* ---------- khởi động ---------- */
window.TVAPI={S,render,saveProg,esc,shuffle,toast,allVocab,isDue,cardState};
S.units=mergeUnits([]);
loadLocal();render();
const C=window.claude;
const fallback=setTimeout(()=>{if(!S.loaded){S.units=mergeUnits(S.units.filter(x=>!x.builtin));S.loaded=true;render()}},12000);
(async()=>{
  if(!C||!C.use){S.units=mergeUnits([]);S.loaded=true;clearTimeout(fallback);render();return}
  const [db,user]=await Promise.all([C.use("db").catch(()=>null),C.use("user").catch(()=>null)]);
  S.db=db;S.user=user;
  if(user){try{S.uid=await user.id()}catch(e){}try{S.canEdit=!!(await user.canEdit())||!!(await user.isOwner())}catch(e){}}
  if(!db){S.units=mergeUnits([]);S.loaded=true;clearTimeout(fallback);render();return}
  if(S.uid){try{const s=await db.doc("data/users/"+S.uid+"/progress").get();if(s.exists){const d=s.data()||{};
    S.prog={cards:{...(d.cards||{}),...S.prog.cards},scores:{...(d.scores||{}),...S.prog.scores},qs:{...(d.qs||{}),...(S.prog.qs||{})},stats:(S.prog.stats&&S.prog.stats.xp>=((d.stats||{}).xp||0))?S.prog.stats:(d.stats||S.prog.stats)}}}catch(e){}}
  db.collection("units").onSnapshot(snap=>{S.units=mergeUnits(snap.docs.map(d=>({id:d.id,...d.data()})));S.loaded=true;clearTimeout(fallback);
      if(S.tab==="cards"&&S.cards&&S.cards.i<S.cards.list.length)return;if(S.tab==="quiz"&&S.quiz)return;
      const y=scrollY;render();scrollTo(0,y)},
    ()=>{S.units=mergeUnits([]);S.loaded=true;render()});
})();
})();
</script>
